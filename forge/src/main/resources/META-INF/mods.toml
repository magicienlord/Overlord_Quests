modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/magicienlord/Overlord_Quests/issues"

displayURL = "https://github.com/magicienlord/Overlord_Quests"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "${mod_id}.png"
authors = "${mod_author}"
credits = "${credits}"
description = '''${description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Questlog's config implementation directly links AutoConfig/Cloth Config classes.
# The library was already a compile/runtime dependency upstream but was not declared
# in mods.toml, allowing a missing library to fail later during class loading.
[[dependencies.${mod_id}]]
modId = "cloth_config"
mandatory = true
versionRange = "${cloth_config_version_range}"
ordering = "NONE"
side = "BOTH"
