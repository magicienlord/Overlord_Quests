name: Add Quest Editor Failure Label

on:
  push:
    branches: [gnarl-bootstrap]
    paths:
      - '.github/workflows/quest-editor-failure-label-migration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gnarl-bootstrap
          fetch-depth: 0

      - name: Add failure tab localization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('common/src/main/resources/assets/questlog/lang/en_us.json')
          text = path.read_text(encoding='utf-8')
          old = '    "questlog.editor.prerequisites": "Prerequisites",\n    "questlog.editor.rewards": "Rewards",'
          new = '    "questlog.editor.prerequisites": "Prerequisites",\n    "questlog.editor.failures": "Failures",\n    "questlog.editor.rewards": "Rewards",'
          if text.count(old) != 1:
              raise SystemExit('quest editor localization insertion point not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove migration workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/quest-editor-failure-label-migration.yml
          git config user.name 'magicienlord'
          git config user.email '126299567+magicienlord@users.noreply.github.com'
          git add common/src/main/resources/assets/questlog/lang/en_us.json
          git commit -m 'Localize quest failure authoring tab'
          git push origin HEAD:gnarl-bootstrap
