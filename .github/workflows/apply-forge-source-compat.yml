name: Apply Forge 47.4.10 source compatibility

on:
  push:
    branches:
      - gnarl-bootstrap
    paths:
      - tools/forge_47410_source_compat.py
      - common/src/main/java/org/infernalstudios/questlog/client/gui/components/FunctionalButton.java
      - .github/workflows/apply-forge-source-compat.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply narrow source compatibility patch
        run: python3 tools/forge_47410_source_compat.py

      - name: Verify expected source changes exist
        run: |
          git diff --check
          git diff --exit-code -- common/src/main/java/org/infernalstudios/questlog/client/gui/components/FunctionalButton.java || true
          if git diff --quiet -- common/src/main/java/org/infernalstudios/questlog/client/gui/screen/QuestlogScreen.java common/src/main/java/org/infernalstudios/questlog/client/gui/screen/QuestEditorScreen.java common/src/main/java/org/infernalstudios/questlog/client/gui/screen/ChapterEditorScreen.java; then
            echo "Compatibility script produced no editor-screen changes."
            exit 1
          fi

      - name: Build patched Forge artifact
        run: ./gradlew :forge:build --stacktrace

      - name: Commit validated source compatibility pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/src/main/java/org/infernalstudios/questlog/client/gui/screen/QuestlogScreen.java
          git add common/src/main/java/org/infernalstudios/questlog/client/gui/screen/QuestEditorScreen.java
          git add common/src/main/java/org/infernalstudios/questlog/client/gui/screen/ChapterEditorScreen.java
          git commit -m "Fix editor buttons for Forge 47.4.10 compilation"
          git push origin HEAD:gnarl-bootstrap

      - name: Upload validated Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlord-quests-forge-1.20.1-source-compat
          path: forge/build/libs/*.jar
          if-no-files-found: error
