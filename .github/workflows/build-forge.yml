name: Build Forge 1.20.1

on:
  push:
    branches:
      - gnarl-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  forge-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Forge artifact
        run: ./gradlew :forge:build --stacktrace

      - name: Upload Forge artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overlord-quests-forge-1.20.1
          path: forge/build/libs/*.jar
          if-no-files-found: error
