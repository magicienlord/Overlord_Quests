name: Build Forge 1.20.1

on:
  push:
    branches:
      - gnarl-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlord-quests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Self-test quest definition validator
        run: python3 tools/test_validate_overlord_quest_examples.py

      - name: Self-test narrative and provider extensions
        run: python3 tools/test_validate_overlord_narrative_extensions.py

      - name: Validate provider runtime contracts
        run: python3 tools/validate_provider_runtime_contracts.py

      - name: Validate sequence-break tracking contracts
        run: python3 tools/validate_sequence_break_tracking.py

      - name: Validate Overlord quest definitions
        run: python3 tools/validate_overlord_quest_examples.py

      - name: Validate Overlord death-screen theme boundary
        run: python3 tools/validate_overlord_death_screen.py

      - name: Self-test runtime quest contracts
        run: python3 tools/test_validate_required_objective_fields.py

      - name: Validate runtime-required objective fields
        run: python3 tools/validate_required_objective_fields.py

      - name: Self-test quest dependency graph validator
        run: python3 tools/test_validate_quest_dependency_cycles.py

      - name: Validate quest completion dependency graph
        run: python3 tools/validate_quest_dependency_cycles.py

      - name: Validate definition cache authority
        run: python3 tools/validate_definition_cache_authority.py

      - name: Validate event bus lifecycle ownership
        run: python3 tools/validate_event_bus_lifecycle.py

      - name: Validate definition wire size
        run: python3 tools/validate_definition_wire_limits.py

      - name: Validate Gnarl popup asset
        run: |
          set -o pipefail
          python3 tools/check_gnarl_popup_asset.py | tee gnarl_popup_asset_report.txt

      - name: Report Gnarl popup static layout
        run: |
          set -o pipefail
          python3 tools/check_gnarl_popup_layout.py | tee gnarl_popup_layout_report.txt

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Forge artifact
        run: ./gradlew :forge:build --stacktrace

      - name: Verify assembled Forge jar
        run: |
          set -euo pipefail
          JAR="$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No Forge runtime jar was produced."
            exit 1
          fi
          echo "Inspecting $JAR"
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/Questlog.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/QuestlogForge.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/client/gui/OverlordPresentationTheme.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/client/gui/SpeakerPortraitTextures.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/client/gui/screen/OverlordSpeakerScreen.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/client/gui/components/QuestlogWideButton.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/client/death/OverlordDeathScreen.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/client/death/OverlordDeathScreens.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/commands/OverlordNarrativeCommands.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/overlord/narrative/OverlordNarrativeState.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/overlord/narrative/FactObjective.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/overlord/narrative/SetFactReward.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/core/quests/objectives/entity/EntityKillStatObjective.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/overlord/provider/QuestProviderService.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/overlord/provider/QuestProviderInteraction.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/client/provider/QuestProviderScreen.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/network/packet/QuestProviderOpenPacket.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/network/packet/QuestProviderActionPacket.class'
          jar tf "$JAR" | grep -Fxq 'assets/questlog/textures/gui/overlord/gnarl_popup.png'
          jar tf "$JAR" | grep -Fxq 'assets/questlog/overlord/definitions/index.json'
          jar tf "$JAR" | grep -Fxq 'META-INF/mods.toml'
          jar tf "$JAR" | grep -Fxq 'META-INF/jarjar/metadata.json'
          jar tf "$JAR" | grep -Eq '^META-INF/jarjar/.*triggers.*\.jar$'

          unzip -p "$JAR" META-INF/mods.toml > assembled-mods.toml
          grep -Fq 'modId = "cloth_config"' assembled-mods.toml

          if jar tf "$JAR" | grep -Eq '^assets/questlog/overlord/definitions/(quests|chapters)/.*_dev\.json$'; then
            echo "Development quest/chapter content was bundled into the runtime JAR."
            exit 1
          fi

      - name: Prepare Foundation B test kit
        run: |
          set -euo pipefail
          KIT='build/gnarl-popup-test-kit'
          JAR="$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No Forge runtime jar was produced."
            exit 1
          fi

          rm -rf "$KIT"
          mkdir -p \
            "$KIT/mods" \
            "$KIT/config/questlog/quests" \
            "$KIT/docs" \
            "$KIT/reference"

          cp "$JAR" "$KIT/mods/"
          cp examples/questlog/quests/overlord_gnarl_popup_dev.json "$KIT/config/questlog/quests/"
          cp docs/GNARL_POPUP_VERTICAL_SLICE.md "$KIT/docs/"
          cp docs/GNARL_VISUAL_ALIGNMENT.md "$KIT/docs/"
          cp docs/FOUNDATION_B_TEST_PROTOCOL.md "$KIT/docs/"
          cp docs/FOUNDATION_B_HANDOFF.md "$KIT/docs/"
          cp docs/EPIC_DEATH_SCREEN_INTEGRATION.md "$KIT/docs/"
          cp gnarl_popup_layout_report.txt "$KIT/docs/"
          cp gnarl_popup_asset_report.txt "$KIT/docs/"
          cp common/src/main/resources/assets/questlog/textures/gui/overlord/gnarl_popup.png "$KIT/reference/gnarl_popup.png"

          cat > "$KIT/INSTALL.txt" <<'EOF'
          OVERLORD QUESTS - GNARL POPUP FOUNDATION B TEST KIT

          1. Back up the test instance.
          2. Remove any separate upstream Questlog JAR. Exactly one mod with technical id questlog must remain.
          3. Copy the contents of this kit's mods/ directory into the instance mods/ directory.
          4. Copy the contents of this kit's config/ directory into the instance config/ directory.
          5. Launch an unpublished local single-player test world with commands available. Do not Open to LAN.
          6. Follow docs/FOUNDATION_B_TEST_PROTOCOL.md exactly.

          This kit contains development quest content. It is not a production quest package and establishes no OVERLORD REIGN story canon.
          EOF

          cat > "$KIT/BUILD_INFO.txt" <<EOF
          OVERLORD QUESTS Foundation B test kit
          commit=$GITHUB_SHA
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          minecraft=1.20.1
          forge=47.4.10
          java=17
          runtime_scope=unpublished_local_singleplayer
          development_quest=config/questlog/quests/overlord_gnarl_popup_dev.json
          portrait_reference=reference/gnarl_popup.png
          death_screen_scaffold=integrated_without_vhs_or_epic_soundscape
          EOF

          (
            cd "$KIT"
            sha256sum mods/* reference/gnarl_popup.png config/questlog/quests/overlord_gnarl_popup_dev.json > SHA256SUMS.txt
          )

      - name: Prepare NPC provider test kit
        run: |
          set -euo pipefail
          KIT='build/provider-test-kit'
          JAR="$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No Forge runtime jar was produced."
            exit 1
          fi

          rm -rf "$KIT"
          mkdir -p \
            "$KIT/mods" \
            "$KIT/config/questlog/quests" \
            "$KIT/docs"

          cp "$JAR" "$KIT/mods/"
          cp examples/questlog/quests/overlord_provider_dev.json "$KIT/config/questlog/quests/"
          cp examples/questlog/quests/overlord_provider_disposition_dev.json "$KIT/config/questlog/quests/"
          cp examples/questlog/quests/overlord_provider_fact_dev.json "$KIT/config/questlog/quests/"
          cp examples/questlog/quests/overlord_narrative_fact_dev.json "$KIT/config/questlog/quests/"
          cp docs/NPC_PROVIDER_SYSTEM.md "$KIT/docs/"
          cp docs/NPC_PROVIDER_TEST_PROTOCOL.md "$KIT/docs/"
          cp docs/NARRATIVE_FACTS.md "$KIT/docs/"

          cat > "$KIT/INSTALL.txt" <<'EOF'
          OVERLORD QUESTS - NPC PROVIDER TEST KIT

          1. Back up the test instance.
          2. Remove any separate upstream Questlog JAR. Exactly one mod with technical id questlog must remain.
          3. Copy the contents of this kit's mods/ directory into the instance mods/ directory.
          4. Copy the contents of this kit's config/ directory into the instance config/ directory.
          5. Launch an unpublished local single-player test world with commands available.
          6. Follow docs/NPC_PROVIDER_TEST_PROTOCOL.md exactly.

          This kit contains development-only provider and narrative-state quest content. It establishes no OVERLORD REIGN story canon.
          EOF

          cat > "$KIT/BUILD_INFO.txt" <<EOF
          OVERLORD QUESTS NPC provider test kit
          commit=$GITHUB_SHA
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          minecraft=1.20.1
          forge=47.4.10
          java=17
          development_quest=config/questlog/quests/overlord_provider_dev.json
          disposition_development_quest=config/questlog/quests/overlord_provider_disposition_dev.json
          fact_provider_development_quest=config/questlog/quests/overlord_provider_fact_dev.json
          narrative_fact_development_quest=config/questlog/quests/overlord_narrative_fact_dev.json
          interaction_scaffold=sneak_main_hand_entity_interact
          provider_authority=server
          EOF

          (
            cd "$KIT"
            sha256sum mods/* config/questlog/quests/overlord_provider_dev.json config/questlog/quests/overlord_provider_disposition_dev.json config/questlog/quests/overlord_provider_fact_dev.json config/questlog/quests/overlord_narrative_fact_dev.json > SHA256SUMS.txt
          )

      - name: Prepare death-screen test kit
        run: |
          set -euo pipefail
          KIT='build/death-screen-test-kit'
          JAR="$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No Forge runtime jar was produced."
            exit 1
          fi

          rm -rf "$KIT"
          mkdir -p "$KIT/mods" "$KIT/docs"

          cp "$JAR" "$KIT/mods/"
          cp docs/EPIC_DEATH_SCREEN_INTEGRATION.md "$KIT/docs/"
          cp docs/DEATH_SCREEN_TEST_PROTOCOL.md "$KIT/docs/"

          cat > "$KIT/INSTALL.txt" <<'EOF'
          OVERLORD QUESTS - DEATH-SCREEN TEST KIT

          1. Back up the test instance.
          2. Remove any separate upstream Questlog JAR. Exactly one mod with technical id questlog must remain.
          3. Copy the contents of this kit's mods/ directory into the instance mods/ directory.
          4. Launch an unpublished local single-player survival test world with commands available.
          5. Follow docs/DEATH_SCREEN_TEST_PROTOCOL.md exactly.

          This validates neutral mechanical scaffolding only. It does not approve a final OVERLORD REIGN death-screen design.
          EOF

          cat > "$KIT/TEST_SETTINGS.txt" <<'EOF'
          Primary manual-control pass:
          enabled=true
          sceneDurationTicks=120
          autoRespawn=false
          allowSkip=true

          Automatic-respawn pass:
          autoRespawn=true

          Apply these values through the generated Questlog client configuration/configuration UI.
          EOF

          cat > "$KIT/BUILD_INFO.txt" <<EOF
          OVERLORD QUESTS death-screen test kit
          commit=$GITHUB_SHA
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          minecraft=1.20.1
          forge=47.4.10
          java=17
          visual_status=neutral_scaffold_not_final_design
          EOF

          (
            cd "$KIT"
            sha256sum mods/* > SHA256SUMS.txt
          )

      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlord-quests-forge-1.20.1
          path: forge/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Gnarl popup test kit
        uses: actions/upload-artifact@v4
        with:
          name: overlord-quests-gnarl-popup-test-kit
          path: build/gnarl-popup-test-kit/
          if-no-files-found: error

      - name: Upload NPC provider test kit
        uses: actions/upload-artifact@v4
        with:
          name: overlord-quests-provider-test-kit
          path: build/provider-test-kit/
          if-no-files-found: error

      - name: Upload death-screen test kit
        uses: actions/upload-artifact@v4
        with:
          name: overlord-quests-death-screen-test-kit
          path: build/death-screen-test-kit/
          if-no-files-found: error
