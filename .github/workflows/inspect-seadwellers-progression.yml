name: Inspect Sea Dwellers Progression

on:
  push:
    branches:
      - gnarl-bootstrap
    paths:
      - '.github/workflows/inspect-seadwellers-progression.yml'
      - 'tools/inspect_seadwellers_progression.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download exact installed Sea Dwellers release
        run: |
          set -euo pipefail
          URL='https://edge.forgecdn.net/files/5343/785/realmrpg_seadwellers_2.9.9_forge_1.20.1.jar'
          curl --fail --location --retry 3 --retry-all-errors "$URL" -o /tmp/realmrpg_seadwellers_2.9.9_forge_1.20.1.jar
          test -s /tmp/realmrpg_seadwellers_2.9.9_forge_1.20.1.jar
          sha256sum /tmp/realmrpg_seadwellers_2.9.9_forge_1.20.1.jar

      - name: Inspect progression resources and class constants
        run: |
          set -euo pipefail
          python3 tools/inspect_seadwellers_progression.py \
            /tmp/realmrpg_seadwellers_2.9.9_forge_1.20.1.jar \
            seadwellers_progression_report.txt

      - name: Upload source audit report
        uses: actions/upload-artifact@v4
        with:
          name: seadwellers-progression-source-audit
          path: seadwellers_progression_report.txt
          if-no-files-found: error
