name: Refresh capability audit

on:
  push:
    branches: [gnarl-bootstrap]
    paths:
      - '.github/workflows/refresh-capability-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gnarl-bootstrap
          fetch-depth: 0

      - name: Refresh active integration status
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/QUEST_ENGINE_CAPABILITY_AUDIT.md')
          text = path.read_text()
          old15 = (
              "The exact approved portrait binary is integrated from the user-supplied `main` upload. "
              "The main upload and runtime resource share Git blob `40c74f6613f0cc23fbf6be0911dedfcfae82865b`, "
              "and runtime validation records SHA-256 `699140666288f84fea0e916c0f77ad719e25acdec60f65d3f8838a0e616444ed`.\n\n"
              "Foundation B now requires only direct unpublished-local-single-player review of the Gnarl popup implementation for:\n"
          )
          new15 = (
              "The current runtime Gnarl portrait is a technical test asset. Runtime validation records SHA-256 "
              "`699140666288f84fea0e916c0f77ad719e25acdec60f65d3f8838a0e616444ed`, but that mechanical identity check must not be "
              "misread as approval of the exact final corrected portrait binary.\n\n"
              "Foundation B still requires direct unpublished-local-single-player review of the Gnarl popup implementation for:\n"
          )
          if old15 not in text:
              raise SystemExit('section 15 stale portrait block not found')
          text = text.replace(old15, new15, 1)
          marker = "- final decision on whether native Questlog overlay controls are sufficient.\n\nPortrait scale, parchment placement, and popup composition remain implementation-test values until that runtime review is accepted."
          replacement = marker + " Exact final portrait-binary approval remains a separate acceptance condition."
          if marker not in text:
              raise SystemExit('section 15 acceptance marker not found')
          text = text.replace(marker, replacement, 1)
          old20 = (
              "## 20. Fork closure policy\n\n"
              "The source audit is now in closure mode. Generic Questlog refactoring is not an active project goal.\n\n"
              "Further engine changes require one of three concrete triggers:\n\n"
              "- an approved OVERLORD REIGN quest cannot be represented correctly with the current objective/reward/presentation surface;\n"
              "- the Foundation B in-game test exposes a reproducible engine or presentation defect;\n"
              "- an actual modpack integration exposes a compatibility failure.\n\n"
              "The inherited CurseForge, Modrinth, and external wiki publication targets have been removed from the private fork. Build output is local or GitHub Actions based unless the Overlord explicitly establishes another publication target.\n\n"
              "Status: ENGINE HARDENING CLOSED PENDING RUNTIME-FOUND DEFECTS."
          )
          new20 = (
              "## 20. Active integration policy\n\n"
              "Generic Questlog refactoring remains outside scope. Engine changes now require a concrete OVERLORD REIGN presentation, quest-authoring, or modpack-integration need.\n\n"
              "The NPC sidequest-provider layer and the death-screen replacement are explicit active integration requirements, so their narrowly scoped engine work is permitted under this policy. This does not reopen unrelated upstream cleanup.\n\n"
              "The inherited CurseForge, Modrinth, and external wiki publication targets remain removed from the private fork. Build output is local or GitHub Actions based unless the Overlord explicitly establishes another publication target.\n\n"
              "Status: GENERIC HARDENING CLOSED; APPROVED INTEGRATION WORK ACTIVE.\n\n"
              "## 21. NPC provider and disposition extensions\n\n"
              "OVERLORD QUESTS now has a server-authoritative NPC sidequest-provider layer derived from the useful quest-giver boundary identified in the Villager Retaliation reference, without importing its numeric reputation system as the governing progression model.\n\n"
              "Provider definitions can select entities, require completed quest markers, require authored world-scoped civilization disposition states, persist the issuing NPC identity, and choose no provider turn-in, exact-provider turn-in, or any-eligible-provider turn-in. Client actions never decide eligibility; the logical server re-resolves provider identity, distance, quest existence, and current eligibility before mutating progress.\n\n"
              "Administrative quest resets delegate to the provider-aware `Quest.resetProgress()` contract, and `/questlog trigger` does not bypass an unaccepted provider binding. Synthetic development fixtures and `/questlog narrative disposition` commands provide deterministic validation without defining canonical civilizations or states.\n\n"
              "Status: IMPLEMENTATION SCAFFOLD GREEN IN CI; DIRECT FORGE RUNTIME ACCEPTANCE PENDING.\n\n"
              "## 22. Death-screen integration boundary\n\n"
              "The useful mechanical core of the Epic Death Screen reference has been integrated as an OVERLORD QUESTS client scaffold: exact vanilla-screen replacement, bounded delay, optional skip, optional non-hardcore auto-respawn, hardcore safety, lifecycle handling, and compatibility veto hooks.\n\n"
              "The reference mod's VHS grain, scanlines, chromatic/tape effects, cassette framing, heartbeat/breathing/tape ambience, cassette audio, and stock humorous phrases are explicitly outside the OVERLORD presentation target and are guarded by a repository validator. The current dark neutral screen is implementation scaffolding only.\n\n"
              "Status: MECHANICS GREEN IN CI; OVERLORD-SPECIFIC VISUAL PASS PLANNED."
          )
          if old20 not in text:
              raise SystemExit('section 20 closure block not found')
          text = text.replace(old20, new20, 1)
          path.write_text(text)
          PY

      - name: Remove migration workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-capability-audit.yml
          git config user.name 'magicienlord'
          git config user.email '126299567+magicienlord@users.noreply.github.com'
          git add docs/QUEST_ENGINE_CAPABILITY_AUDIT.md
          git commit -m 'Refresh capability audit for active integrations'
          git push origin HEAD:gnarl-bootstrap
