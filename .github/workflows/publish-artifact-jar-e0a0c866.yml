name: Publish validated Quest artifact JAR

on:
  push:
    branches:
      - delivery/quest-jar-artifact-e0a0c866

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact validated Forge artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10379446060'
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact

      - name: Verify and stage exact JAR
        run: |
          set -euo pipefail
          JAR="$(find artifact -type f -name '*.jar' ! -name '*sources*' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo 'No runtime JAR found in validated artifact.'
            exit 1
          fi
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/Questlog.class'
          jar tf "$JAR" | grep -Fxq 'org/infernalstudios/questlog/QuestlogForge.class'
          jar tf "$JAR" | grep -Fxq 'assets/questlog/overlord/definitions/index.json'
          jar tf "$JAR" | grep -Fxq 'META-INF/mods.toml'
          cp "$JAR" Overlord_Quests-1.20.1-e0a0c866.jar
          sha256sum Overlord_Quests-1.20.1-e0a0c866.jar > Overlord_Quests-1.20.1-e0a0c866.jar.sha256

      - name: Publish direct JAR release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: overlord-quests-e0a0c866-artifact
          TARGET_SHA: e0a0c8667e389f735b8c138227cf62cc889e28c3
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            Overlord_Quests-1.20.1-e0a0c866.jar \
            Overlord_Quests-1.20.1-e0a0c866.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title 'Overlord Quests 1.20.1 e0a0c866 validated artifact' \
            --notes 'Direct JAR extracted from GitHub Actions artifact 10379446060. That artifact was produced by Forge build run 34924583259 from exact validated commit e0a0c8667e389f735b8c138227cf62cc889e28c3.'
