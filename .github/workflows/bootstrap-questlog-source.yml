name: Bootstrap Questlog 3.3.3 source

on:
  push:
    branches:
      - gnarl-bootstrap
    paths:
      - .github/workflows/bootstrap-questlog-source.yml

permissions:
  contents: write

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Overlord Quests
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact Questlog 3.3.3 source baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/questlog-upstream
          git clone --no-checkout https://github.com/infernalstudios/Questlog.git /tmp/questlog-upstream
          git -C /tmp/questlog-upstream checkout 72edfa8cc2a411265ad20a916ce0282ec7be56c0
          test "$(git -C /tmp/questlog-upstream rev-parse HEAD)" = "72edfa8cc2a411265ad20a916ce0282ec7be56c0"

      - name: Preserve supplied reference JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference
          if [ -f questlog-forge-1.20.1-3.3.3.jar ]; then
            mv questlog-forge-1.20.1-3.3.3.jar reference/
          fi

      - name: Import upstream source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='reference/' \
            /tmp/questlog-upstream/ ./
          mkdir -p reference
          if [ -f /tmp/questlog-upstream/LICENSE ]; then
            cp /tmp/questlog-upstream/LICENSE reference/QUESTLOG_APACHE_2_LICENSE.txt
          fi
          cat > UPSTREAM_BASELINE.md <<'EOF'
          # Upstream baseline

          OVERLORD QUESTS begins from Infernal Studios Questlog 3.3.3 for Minecraft 1.20.1.

          Upstream repository: `infernalstudios/Questlog`

          Upstream branch: `1.20.1`

          Exact baseline commit: `72edfa8cc2a411265ad20a916ce0282ec7be56c0`

          Upstream license: Apache License 2.0. The original copyright and license are retained in `LICENSE` and `reference/QUESTLOG_APACHE_2_LICENSE.txt`.

          The supplied Forge 1.20.1 release JAR is preserved in `reference/questlog-forge-1.20.1-3.3.3.jar` for binary comparison during adaptation.
          EOF

      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bootstrap Questlog 3.3.3 source baseline"
          git push origin HEAD:gnarl-bootstrap
