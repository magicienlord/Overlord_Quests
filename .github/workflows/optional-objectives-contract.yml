name: Optional Objectives Contract

on:
  push:
    branches:
      - gnarl-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlord-quests-optional-objectives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optional-objectives-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate optional objective contracts
        run: python3 tools/validate_optional_objectives.py
