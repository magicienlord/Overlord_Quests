name: Add Quest Editor Failure Authoring

on:
  push:
    branches: [gnarl-bootstrap]
    paths:
      - '.github/workflows/quest-editor-failures-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gnarl-bootstrap
          fetch-depth: 0

      - name: Add failure-condition authoring tab
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('common/src/main/java/org/infernalstudios/questlog/client/gui/screen/QuestEditorScreen.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    private final List<JsonObject> tempObjectives = new ArrayList<>();\n'
                  '    private final List<JsonObject> tempPrerequisites = new ArrayList<>();\n'
                  '    private final List<JsonObject> tempRewards = new ArrayList<>();',
                  '    private final List<JsonObject> tempObjectives = new ArrayList<>();\n'
                  '    private final List<JsonObject> tempPrerequisites = new ArrayList<>();\n'
                  '    private final List<JsonObject> tempFailures = new ArrayList<>();\n'
                  '    private final List<JsonObject> tempRewards = new ArrayList<>();'
              ),
              (
                  '            this.tempObjectives.clear();\n'
                  '            this.tempPrerequisites.clear();\n'
                  '            this.tempRewards.clear();',
                  '            this.tempObjectives.clear();\n'
                  '            this.tempPrerequisites.clear();\n'
                  '            this.tempFailures.clear();\n'
                  '            this.tempRewards.clear();'
              ),
              (
                  '        this.loadList(definition.getAsJsonArray("failures"), null);',
                  '        this.loadList(definition.getAsJsonArray("failures"), this.tempFailures);'
              ),
              (
                  '            int startX = panel2X + (160 - (4 * tabBtnSize + 3 * (tabBtnSpacing - tabBtnSize))) / 2;',
                  '            int startX = panel2X + (160 - (tabs.length * tabBtnSize + (tabs.length - 1) * (tabBtnSpacing - tabBtnSize))) / 2;'
              ),
              (
                  '                    case OBJECTIVES -> Component.translatable("questlog.editor.objectives");\n'
                  '                    case PREREQUISITES -> Component.translatable("questlog.editor.prerequisites");\n'
                  '                    case REWARDS -> Component.translatable("questlog.editor.rewards");\n'
                  '                    default -> Component.translatable("questlog.editor.settings");',
                  '                    case OBJECTIVES -> Component.translatable("questlog.editor.objectives");\n'
                  '                    case PREREQUISITES -> Component.translatable("questlog.editor.prerequisites");\n'
                  '                    case FAILURES -> Component.translatable("questlog.editor.failures");\n'
                  '                    case REWARDS -> Component.translatable("questlog.editor.rewards");\n'
                  '                    default -> Component.translatable("questlog.editor.settings");'
              ),
              (
                  '                                    case OBJECTIVES -> TAB_OBJECTIVES_SELECTED;\n'
                  '                                    case PREREQUISITES -> TAB_PREREQUISITES_SELECTED;\n'
                  '                                    case REWARDS -> TAB_REWARDS_SELECTED;\n'
                  '                                    default -> TAB_SETTINGS_SELECTED;',
                  '                                    case OBJECTIVES, FAILURES -> TAB_OBJECTIVES_SELECTED;\n'
                  '                                    case PREREQUISITES -> TAB_PREREQUISITES_SELECTED;\n'
                  '                                    case REWARDS -> TAB_REWARDS_SELECTED;\n'
                  '                                    default -> TAB_SETTINGS_SELECTED;'
              ),
              (
                  '                                    case OBJECTIVES -> TAB_OBJECTIVES_HIGHLIGHTED;\n'
                  '                                    case PREREQUISITES -> TAB_PREREQUISITES_HIGHLIGHTED;\n'
                  '                                    case REWARDS -> TAB_REWARDS_HIGHLIGHTED;\n'
                  '                                    default -> TAB_SETTINGS_HIGHLIGHTED;',
                  '                                    case OBJECTIVES, FAILURES -> TAB_OBJECTIVES_HIGHLIGHTED;\n'
                  '                                    case PREREQUISITES -> TAB_PREREQUISITES_HIGHLIGHTED;\n'
                  '                                    case REWARDS -> TAB_REWARDS_HIGHLIGHTED;\n'
                  '                                    default -> TAB_SETTINGS_HIGHLIGHTED;'
              ),
              (
                  '                                    case OBJECTIVES -> TAB_OBJECTIVES_TEXTURE;\n'
                  '                                    case PREREQUISITES -> TAB_PREREQUISITES_TEXTURE;\n'
                  '                                    case REWARDS -> TAB_REWARDS_TEXTURE;\n'
                  '                                    default -> TAB_SETTINGS_TEXTURE;',
                  '                                    case OBJECTIVES, FAILURES -> TAB_OBJECTIVES_TEXTURE;\n'
                  '                                    case PREREQUISITES -> TAB_PREREQUISITES_TEXTURE;\n'
                  '                                    case REWARDS -> TAB_REWARDS_TEXTURE;\n'
                  '                                    default -> TAB_SETTINGS_TEXTURE;'
              ),
              (
                  '            if (this.activeTab == ActiveTab.OBJECTIVES || this.activeTab == ActiveTab.PREREQUISITES) {',
                  '            if (this.activeTab == ActiveTab.OBJECTIVES || this.activeTab == ActiveTab.PREREQUISITES || this.activeTab == ActiveTab.FAILURES) {'
              ),
              (
                  '        if (this.activeTab == ActiveTab.OBJECTIVES) {\n'
                  '            return this.tempObjectives;\n'
                  '        } else if (this.activeTab == ActiveTab.PREREQUISITES) {\n'
                  '            return this.tempPrerequisites;\n'
                  '        } else {\n'
                  '            return this.tempRewards;\n'
                  '        }',
                  '        if (this.activeTab == ActiveTab.OBJECTIVES) {\n'
                  '            return this.tempObjectives;\n'
                  '        } else if (this.activeTab == ActiveTab.PREREQUISITES) {\n'
                  '            return this.tempPrerequisites;\n'
                  '        } else if (this.activeTab == ActiveTab.FAILURES) {\n'
                  '            return this.tempFailures;\n'
                  '        } else {\n'
                  '            return this.tempRewards;\n'
                  '        }'
              ),
              (
                  '        json.add("prerequisites", reqArr);\n'
                  '        json.remove("requirements");\n\n'
                  '        JsonArray rewArr = new JsonArray();',
                  '        json.add("prerequisites", reqArr);\n'
                  '        json.remove("requirements");\n\n'
                  '        JsonArray failureArr = new JsonArray();\n'
                  '        for (JsonObject failure : this.tempFailures) {\n'
                  '            failureArr.add(failure);\n'
                  '        }\n'
                  '        json.add("failures", failureArr);\n\n'
                  '        JsonArray rewArr = new JsonArray();'
              ),
              (
                  '    enum ActiveTab {\n'
                  '        PREREQUISITES,\n'
                  '        OBJECTIVES,\n'
                  '        REWARDS,\n'
                  '        SETTINGS\n'
                  '    }',
                  '    enum ActiveTab {\n'
                  '        PREREQUISITES,\n'
                  '        OBJECTIVES,\n'
                  '        FAILURES,\n'
                  '        REWARDS,\n'
                  '        SETTINGS\n'
                  '    }'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove migration workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/quest-editor-failures-migration.yml
          git config user.name 'magicienlord'
          git config user.email '126299567+magicienlord@users.noreply.github.com'
          git add common/src/main/java/org/infernalstudios/questlog/client/gui/screen/QuestEditorScreen.java
          git commit -m 'Add quest failure condition authoring'
          git push origin HEAD:gnarl-bootstrap
