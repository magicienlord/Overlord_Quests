name: Remaining Questline Closure

on:
  push:
    branches:
      - gnarl-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlord-quests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate delegated civilization and NightWalker closure
        run: python3 tools/validate_remaining_questline_closure.py
