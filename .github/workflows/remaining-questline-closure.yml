name: Remaining Questline Closure

on:
  push:
    branches:
      - gnarl-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlord-quests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate delegated civilization and NightWalker closure
        run: python3 tools/validate_remaining_questline_closure.py

      - name: Validate Fathoms Historian closure
        run: python3 tools/validate_fathoms_sidequest_contracts.py

      - name: Validate final assignment ledger reconciliation
        run: python3 tools/validate_final_assignment_reconciliation.py

      - name: Validate production narrative-fact documentation
        run: python3 tools/validate_narrative_fact_documentation.py
