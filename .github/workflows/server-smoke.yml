name: Dedicated Server Smoke

on:
  push:
    branches:
      - gnarl-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlord-quests-server-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedicated-server-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Configure disposable test server
        run: |
          mkdir -p forge/run
          printf 'eula=true\n' > forge/run/eula.txt
          cat > forge/run/server.properties <<'EOF'
          online-mode=false
          level-type=minecraft:flat
          generate-structures=false
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          EOF

      - name: Prepare Forge server run and runtime classpath
        run: ./gradlew :common:createMinecraftArtifacts :forge:prepareServerRun :forge:resolveServerSmokeRuntime --no-daemon --stacktrace

      - name: Boot Forge dedicated server
        id: server
        shell: bash
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/dedicated-server-smoke.log"

          set +e
          timeout --signal=TERM --kill-after=15s 120s \
            ./gradlew :forge:runServer --offline --no-daemon --stacktrace \
            >"$LOG" 2>&1
          STATUS=$?
          set -e

          cat "$LOG"

          if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG"; then
            echo "Dedicated Forge server reached normal ready state."
            exit 0
          fi

          echo "Dedicated Forge server did not reach normal ready state (command status: $STATUS)." >&2
          exit 1

      - name: Upload dedicated-server smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlord-quests-dedicated-server-smoke-${{ github.run_number }}
          path: dedicated-server-smoke.log
          if-no-files-found: error
          retention-days: 14
