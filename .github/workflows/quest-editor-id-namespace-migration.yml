name: Align Quest Editor ID Namespace

on:
  push:
    branches: [gnarl-bootstrap]
    paths:
      - '.github/workflows/quest-editor-id-namespace-migration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gnarl-bootstrap
          fetch-depth: 0

      - name: Align quest ID validation with server authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          java = Path('common/src/main/java/org/infernalstudios/questlog/client/gui/screen/QuestEditorScreen.java')
          text = java.read_text(encoding='utf-8')
          old = (
              '        ResourceLocation rl = ResourceLocation.tryParse(this.tempId);\n'
              '        if (rl == null) {\n'
              '            rl = new ResourceLocation(Questlog.MODID, this.tempId.replace(":", "_"));\n'
              '        }\n'
          )
          new = (
              '        String idStr = this.tempId.trim();\n'
              '        if (idStr.isEmpty()) return;\n\n'
              '        ResourceLocation rl;\n'
              '        try {\n'
              '            rl = idStr.contains(":") ? ResourceLocation.tryParse(idStr) : new ResourceLocation(Questlog.MODID, idStr);\n'
              '        } catch (Exception e) {\n'
              '            return;\n'
              '        }\n'
              '        if (rl == null || !Questlog.MODID.equals(rl.getNamespace())) {\n'
              '            if (this.idBox != null) {\n'
              '                this.idBox.setTooltip(Tooltip.create(Component.translatable(\n'
              '                        "questlog.editor.error.quest_namespace",\n'
              '                        Questlog.MODID\n'
              '                )));\n'
              '            }\n'
              '            return;\n'
              '        }\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'quest save ID block found {text.count(old)} times')
          java.write_text(text.replace(old, new, 1), encoding='utf-8')

          lang = Path('common/src/main/resources/assets/questlog/lang/en_us.json')
          text = lang.read_text(encoding='utf-8')
          old = '    "questlog.editor.error.chapter_namespace": "Chapter IDs must use the %s namespace.",'
          new = (
              '    "questlog.editor.error.chapter_namespace": "Chapter IDs must use the %s namespace.",\n'
              '    "questlog.editor.error.quest_namespace": "Quest IDs must use the %s namespace.",'
          )
          if text.count(old) != 1:
              raise SystemExit('quest namespace localization insertion point not found exactly once')
          lang.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove migration workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/quest-editor-id-namespace-migration.yml
          git config user.name 'magicienlord'
          git config user.email '126299567+magicienlord@users.noreply.github.com'
          git add common/src/main/java/org/infernalstudios/questlog/client/gui/screen/QuestEditorScreen.java common/src/main/resources/assets/questlog/lang/en_us.json
          git commit -m 'Align quest editor ID namespace with server'
          git push origin HEAD:gnarl-bootstrap
