name: Apply provider command reset correction

on:
  push:
    branches: [gnarl-bootstrap]
    paths:
      - '.github/workflows/apply-provider-command-reset-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gnarl-bootstrap
          fetch-depth: 0

      - name: Make command resets provider-aware
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('common/src/main/java/org/infernalstudios/questlog/commands/QuestlogCommands.java')
          text = path.read_text()
          full_loop = r"            for \(Quest quest : manager\.getAllQuests\(\)\) \{\n                quest\.prerequisites\.forEach\(trigger -> trigger\.forceSetUnits\(0\)\);\n                quest\.objectives\.forEach\(obj -> obj\.forceSetUnits\(0\)\);\n                quest\.failureConditions\.forEach\(obj -> obj\.forceSetUnits\(0\)\);\n                quest\.rewards\.forEach\(Reward::revokeReward\);\n                quest\.hasSentTrigger = quest\.prerequisites\.isEmpty\(\);\n                quest\.hasSentCompletion = false;\n            \}\n"
          text, count = re.subn(full_loop, "            for (Quest quest : manager.getAllQuests()) {\\n                quest.resetProgress();\\n            }\\n", text)
          if count != 2:
              raise SystemExit(f'expected exactly 2 full manual reset loops, found {count}')
          branch = r"                \} else \{\n                    quest\.prerequisites\.forEach\(trigger -> trigger\.forceSetUnits\(0\)\);\n                    quest\.objectives\.forEach\(obj -> obj\.forceSetUnits\(0\)\);\n                    quest\.failureConditions\.forEach\(obj -> obj\.forceSetUnits\(0\)\);\n                    quest\.rewards\.forEach\(Reward::revokeReward\);\n                    quest\.hasSentTrigger = quest\.prerequisites\.isEmpty\(\);\n                    quest\.hasSentCompletion = false;\n                \}\n"
          text, count = re.subn(branch, "                } else {\\n                    quest.resetProgress();\\n                }\\n", text)
          if count != 1:
              raise SystemExit(f'expected exactly one modifyProgress reset branch, found {count}')
          trigger = r"            for \(Quest quest : affectedQuests\) \{\n                if \(!quest\.isTriggered\(\)\) \{\n                    quest\.prerequisites\.forEach\(trigger -> trigger\.forceSetUnits\(trigger\.getRequiredAmount\(\)\)\);\n                    count\+\+;\n                \}\n            \}\n"
          trigger_replacement = "            for (Quest quest : affectedQuests) {\\n                if (quest.getProviderRule() != null && quest.getProviderBinding() == null) {\\n                    continue;\\n                }\\n                if (!quest.isTriggered()) {\\n                    quest.prerequisites.forEach(trigger -> trigger.forceSetUnits(trigger.getRequiredAmount()));\\n                    count++;\\n                }\\n            }\\n"
          text, count = re.subn(trigger, trigger_replacement, text)
          if count != 1:
              raise SystemExit(f'expected exactly one trigger loop, found {count}')
          if 'quest.hasSentTrigger = quest.prerequisites.isEmpty();' in text:
              raise SystemExit('provider-unsafe hasSentTrigger assignment remains in command resets')
          if text.count('quest.resetProgress();') < 3:
              raise SystemExit('provider-aware resetProgress calls were not installed in all reset paths')
          path.write_text(text)
          PY

      - name: Remove migration workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-provider-command-reset-fix.yml
          git config user.name 'magicienlord'
          git config user.email '126299567+magicienlord@users.noreply.github.com'
          git add common/src/main/java/org/infernalstudios/questlog/commands/QuestlogCommands.java
          git commit -m 'Make quest reset commands provider-aware'
          git push origin HEAD:gnarl-bootstrap
