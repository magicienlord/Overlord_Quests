name: Add Death Screen Test Kit

on:
  push:
    branches: [gnarl-bootstrap]
    paths:
      - '.github/workflows/death-screen-test-kit-migration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gnarl-bootstrap
          fetch-depth: 0

      - name: Add death-screen test-kit packaging
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-forge.yml')
          text = path.read_text(encoding='utf-8')

          marker = '      - name: Upload Forge artifact\n'
          if text.count(marker) != 1:
              raise SystemExit(f'upload marker count was {text.count(marker)}')

          step = (
              '      - name: Prepare death-screen test kit\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              "          KIT='build/death-screen-test-kit'\n"
              '          JAR="$(find forge/build/libs -maxdepth 1 -type f -name \'*.jar\' ! -name \'*sources*\' | head -n 1)"\n'
              '          if [ -z "$JAR" ]; then\n'
              '            echo "No Forge runtime jar was produced."\n'
              '            exit 1\n'
              '          fi\n\n'
              '          rm -rf "$KIT"\n'
              '          mkdir -p "$KIT/mods" "$KIT/docs"\n\n'
              '          cp "$JAR" "$KIT/mods/"\n'
              '          cp docs/EPIC_DEATH_SCREEN_INTEGRATION.md "$KIT/docs/"\n'
              '          cp docs/DEATH_SCREEN_TEST_PROTOCOL.md "$KIT/docs/"\n\n'
              '          cat > "$KIT/INSTALL.txt" <<\'EOF\'\n'
              '          OVERLORD QUESTS - DEATH-SCREEN TEST KIT\n\n'
              '          1. Back up the test instance.\n'
              '          2. Remove any separate upstream Questlog JAR. Exactly one mod with technical id questlog must remain.\n'
              '          3. Copy the contents of this kit\'s mods/ directory into the instance mods/ directory.\n'
              '          4. Launch an unpublished local single-player survival test world with commands available.\n'
              '          5. Follow docs/DEATH_SCREEN_TEST_PROTOCOL.md exactly.\n\n'
              '          This validates neutral mechanical scaffolding only. It does not approve a final OVERLORD REIGN death-screen design.\n'
              '          EOF\n\n'
              '          cat > "$KIT/TEST_SETTINGS.txt" <<\'EOF\'\n'
              '          Primary manual-control pass:\n'
              '          enabled=true\n'
              '          sceneDurationTicks=120\n'
              '          autoRespawn=false\n'
              '          allowSkip=true\n\n'
              '          Automatic-respawn pass:\n'
              '          autoRespawn=true\n\n'
              '          Apply these values through the generated Questlog client configuration/configuration UI.\n'
              '          EOF\n\n'
              '          cat > "$KIT/BUILD_INFO.txt" <<EOF\n'
              '          OVERLORD QUESTS death-screen test kit\n'
              '          commit=$GITHUB_SHA\n'
              '          workflow=$GITHUB_WORKFLOW\n'
              '          run_id=$GITHUB_RUN_ID\n'
              '          minecraft=1.20.1\n'
              '          forge=47.4.10\n'
              '          java=17\n'
              '          visual_status=neutral_scaffold_not_final_design\n'
              '          EOF\n\n'
              '          (\n'
              '            cd "$KIT"\n'
              '            sha256sum mods/* > SHA256SUMS.txt\n'
              '          )\n\n'
          )
          text = text.replace(marker, step + marker, 1)

          upload_marker = (
              '      - name: Upload NPC provider test kit\n'
              '        uses: actions/upload-artifact@v4\n'
              '        with:\n'
              '          name: overlord-quests-provider-test-kit\n'
              '          path: build/provider-test-kit/\n'
              '          if-no-files-found: error\n'
          )
          if text.count(upload_marker) != 1:
              raise SystemExit(f'provider upload block count was {text.count(upload_marker)}')

          upload = (
              '\n      - name: Upload death-screen test kit\n'
              '        uses: actions/upload-artifact@v4\n'
              '        with:\n'
              '          name: overlord-quests-death-screen-test-kit\n'
              '          path: build/death-screen-test-kit/\n'
              '          if-no-files-found: error\n'
          )
          text = text.replace(upload_marker, upload_marker + upload, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove migration workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/death-screen-test-kit-migration.yml
          git config user.name 'magicienlord'
          git config user.email '126299567+magicienlord@users.noreply.github.com'
          git add .github/workflows/build-forge.yml
          git commit -m 'Package death-screen runtime test kit'
          git push origin HEAD:gnarl-bootstrap
