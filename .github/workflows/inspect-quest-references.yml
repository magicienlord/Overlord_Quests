name: Inspect quest reference jars

on:
  push:
    branches: [gnarl-bootstrap]
    paths:
      - '.github/workflows/inspect-quest-references.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch and reference history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract exact uploaded reference jars from main
        run: |
          set -euo pipefail
          mkdir -p reference-inspection/input reference-inspection/output
          git fetch origin main
          git show origin/main:epicdeathscreen-forge-1.20.1-1.1.0-beta.2.jar > reference-inspection/input/epicdeathscreen.jar
          git show origin/main:villager_retaliation-neoforge-1.21.1-1.0.0-beta.13-hotfix.1.jar > reference-inspection/input/villager_retaliation.jar
          sha256sum reference-inspection/input/*.jar | tee reference-inspection/output/SHA256SUMS.txt

      - name: Capture jar inventories and metadata
        run: |
          set -euo pipefail
          jar tf reference-inspection/input/epicdeathscreen.jar > reference-inspection/output/epicdeathscreen-jar-list.txt
          jar tf reference-inspection/input/villager_retaliation.jar > reference-inspection/output/villager-retaliation-jar-list.txt
          mkdir -p reference-inspection/output/epic-resources reference-inspection/output/vr-resources
          cd reference-inspection/output/epic-resources
          jar xf ../../input/epicdeathscreen.jar META-INF/mods.toml pack.mcmeta 2>/dev/null || true
          cd ../vr-resources
          jar xf ../../input/villager_retaliation.jar META-INF/neoforge.mods.toml META-INF/mods.toml pack.mcmeta 2>/dev/null || true
          cd ../../..

      - name: Decompile exact references with CFR
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o reference-inspection/cfr.jar \
            https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          mkdir -p reference-inspection/output/epic-src reference-inspection/output/vr-src
          java -jar reference-inspection/cfr.jar reference-inspection/input/epicdeathscreen.jar \
            --outputdir reference-inspection/output/epic-src --silent true
          java -jar reference-inspection/cfr.jar reference-inspection/input/villager_retaliation.jar \
            --outputdir reference-inspection/output/vr-src --silent true

      - name: Extract non-class reference assets
        run: |
          set -euo pipefail
          mkdir -p reference-inspection/output/epic-assets reference-inspection/output/vr-assets
          cd reference-inspection/output/epic-assets
          jar xf ../../input/epicdeathscreen.jar
          find . -name '*.class' -delete
          cd ../vr-assets
          jar xf ../../input/villager_retaliation.jar
          find . -name '*.class' -delete
          cd ../../..
          rm -f reference-inspection/cfr.jar

      - name: Print Epic Death Screen exact source inventory and code
        run: |
          set -euo pipefail
          echo '=== EPIC DEATH SCREEN JAVA FILES ==='
          find reference-inspection/output/epic-src -type f -name '*.java' | sort
          echo '=== EPIC DEATH SCREEN NON-CLASS ASSETS ==='
          find reference-inspection/output/epic-assets -type f | sort
          echo '=== EPIC DEATH SCREEN SOURCE ==='
          while IFS= read -r file; do
            echo "===== BEGIN ${file} ====="
            cat "$file"
            echo "===== END ${file} ====="
          done < <(find reference-inspection/output/epic-src -type f -name '*.java' | sort)

      - name: Print relevant Villager Retaliation provider source inventory
        run: |
          set -euo pipefail
          find reference-inspection/output/vr-src -type f -name '*.java' | sort \
            | grep -E '/quest/(provider|conditions|pool|runtime)/|/quest/QuestExecutionContext.java$|/quest/VillagerQuestSavedData.java$' \
            || true

      - name: Upload inspection corpus
        uses: actions/upload-artifact@v4
        with:
          name: overlord-quests-reference-inspection
          path: reference-inspection/output
          if-no-files-found: error
