name: Ending Contract

on:
  push:
    branches:
      - gnarl-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlord-quests-ending-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ending-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate central ending activation contracts
        run: |
          python3 tools/validate_overlord_ending_screen.py
          python3 tools/validate_central_end_campaign.py
