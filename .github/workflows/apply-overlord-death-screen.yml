          ]
          forbidden = ('grain', 'scanline', 'chromatic', 'cassette', 'heartbeat', 'breathing', 'tape.ogg')
          errors = []
          for root in roots:
              paths = [root] if root.is_file() else sorted(root.glob('*.java'))
              for path in paths:
                  text = path.read_text(encoding='utf-8').lower()
                  # Documentation comments may state that rejected effects are absent.
                  code = '\n'.join(line for line in text.splitlines() if not line.strip().startswith(('*', '//')))
                  for token in forbidden:
                      if token in code:
                          errors.append(f'{path.relative_to(ROOT)} contains forbidden production token {token!r}')
          resource_root = ROOT / 'common/src/main/resources/assets/questlog'
          if resource_root.exists():
              for path in resource_root.rglob('*'):
                  if path.is_file() and any(token in path.name.lower() for token in ('cassette', 'heartbeat', 'breathing', 'tape')):
                      errors.append(f'forbidden Epic Death Screen audio resource: {path.relative_to(ROOT)}')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)
          print('OVERLORD death-screen theme boundary: PASS (no VHS/audio production presentation)')
          PY
          chmod +x tools/validate_overlord_death_screen.py

      - name: Validate and build
        run: |
          set -euo pipefail
          python3 tools/test_validate_overlord_quest_examples.py
          python3 tools/validate_overlord_quest_examples.py
          python3 tools/validate_overlord_death_screen.py
          chmod +x gradlew
          ./gradlew :forge:build --stacktrace

      - name: Commit implementation and remove migration
        run: |
          set -euo pipefail
          rm .github/workflows/apply-overlord-death-screen.yml
          git config user.name 'magicienlord'
          git config user.email '126299567+magicienlord@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate neutral Overlord death-screen mechanics'
          git push origin HEAD:gnarl-bootstrap
