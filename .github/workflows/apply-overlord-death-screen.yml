name: Apply Overlord death screen

on:
  push:
    branches: [gnarl-bootstrap]
    paths:
      - '.github/workflows/apply-overlord-death-screen.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gnarl-bootstrap
          fetch-depth: 0

      - name: Add neutral Overlord death-screen mechanics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = {
          'common/src/main/java/org/infernalstudios/questlog/client/death/OverlordDeathSceneClock.java': r'''package org.infernalstudios.questlog.client.death;

/**
 * Bounded client-side timing state for the custom death flow.
 *
 * Adapted from the MIT-licensed Epic Death Screen scene clock, but deliberately
 * contains no VHS, grain, cassette, soundscape, or other presentation logic.
 */
public final class OverlordDeathSceneClock {
    public static final int MIN_DURATION_TICKS = 40;
    public static final int MAX_DURATION_TICKS = 400;

    private final int duration;
    private int ticks;
    private boolean requestedRespawn;

    public OverlordDeathSceneClock(int durationTicks) {
        this.duration = Math.max(MIN_DURATION_TICKS, Math.min(MAX_DURATION_TICKS, durationTicks));
    }

    public void tick() {
        if (this.ticks < Integer.MAX_VALUE) {
            this.ticks++;
        }
    }

    public void skip() {
        this.ticks = Math.max(this.ticks, this.duration);
    }

    public int ticks() {
        return this.ticks;
    }

    public int duration() {
        return this.duration;
    }

    public boolean ready() {
        return this.ticks >= this.duration;
    }

    public float progress() {
        return Math.min(1.0F, (float) this.ticks / (float) this.duration);
    }

    public boolean requestAutoRespawn(boolean enabled, boolean hardcore, boolean dead) {
        if (!enabled || hardcore || !dead || !this.ready() || this.requestedRespawn) {
            return false;
        }
        this.requestedRespawn = true;
        return true;
    }
}
''',
          'common/src/main/java/org/infernalstudios/questlog/client/death/OverlordDeathScreenHooks.java': r'''package org.infernalstudios.questlog.client.death;

import net.minecraft.client.player.LocalPlayer;
import org.infernalstudios.questlog.Questlog;

import java.util.HashSet;
import java.util.LinkedHashMap;
import java.util.Map;
import java.util.Objects;
import java.util.Set;
import java.util.function.Predicate;

/**
 * Compatibility vetoes for revival/knockout systems.
 *
 * A failed compatibility hook is treated as blocked. It is safer to leave a
 * foreign death/revival screen untouched than to replace it after its API changed.
 */
public final class OverlordDeathScreenHooks {
    private static final Map<String, Predicate<LocalPlayer>> BLOCKERS = new LinkedHashMap<>();
    private static final Set<String> FAILED = new HashSet<>();

    private OverlordDeathScreenHooks() {
    }

    public static void registerBlocker(String id, Predicate<LocalPlayer> blocker) {
        BLOCKERS.put(Objects.requireNonNull(id), Objects.requireNonNull(blocker));
        FAILED.remove(id);
    }

    public static boolean isBlocked(LocalPlayer player) {
        if (player == null) return true;

        for (Map.Entry<String, Predicate<LocalPlayer>> entry : BLOCKERS.entrySet()) {
            if (FAILED.contains(entry.getKey())) {
                return true;
            }
            try {
                if (entry.getValue().test(player)) {
                    return true;
                }
            } catch (LinkageError | RuntimeException error) {
                FAILED.add(entry.getKey());
                Questlog.LOGGER.warn(
                        "Overlord death screen compatibility hook {} failed; leaving the foreign death flow untouched",
                        entry.getKey(), error
                );
                return true;
            }
        }
        return false;
    }
}
