plugins {
    id 'multiloader-common'
    id 'me.modmuss50.mod-publish-plugin'
}

configurations {
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonResources project(path: ':common', configuration: 'commonResources')
}

/*
 * The upstream multiloader build recompiles the common Java source set inside
 * every loader project. With Forge 47.4.10 this exposes a mapping/compiler edge
 * case in Minecraft's AbstractButton constructor metadata: anonymous subclasses
 * from Questlog's editor screens receive duplicate synthetic parameter names.
 *
 * The common project already compiles and reobfuscates successfully on the same
 * Java 17/Parchment baseline. Compile the Forge adapter against that project
 * output, then package the already-compiled common classes into the Forge jar so
 * the complete mod is still reobfuscated as one loader artifact. This preserves
 * the upstream editor implementation instead of rewriting nine otherwise-valid
 * anonymous button classes solely for a loader build quirk.
 */
tasks.named('compileJava', JavaCompile) {
    dependsOn project(':common').tasks.named('compileJava')
}

jar {
    dependsOn project(':common').tasks.named('classes')
    from(project(':common').sourceSets.main.output.classesDirs)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

publishMods {
    changelog = rootProject.file("CHANGELOG-LATEST.md").text
    type = STABLE
    version = "${project.version}-${minecraft_version}-${project.name}"
    displayName = "${mod_name} ${project.name.capitalize()} ${minecraft_version} - ${project.version}"
    modLoaders.add(project.name)

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1202066"
        minecraftVersions.add("${minecraft_version}")
        client = true
        server = true

        requires("cloth-config")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "ufQYCY6N"
        minecraftVersions.add("${minecraft_version}")

        requires("cloth-config")
    }
}
